services:
  - type: web
    name: campusfix
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/campusfix.sqlite
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: campusfix-data
      mountPath: /var/data
      sizeGB: 1
